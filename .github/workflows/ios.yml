name: iOS build

# Собирает .ipa из проекта Godot на бесплатном macOS-раннере GitHub.
# Запуск: вкладка "Actions" -> "iOS build" -> "Run workflow".
# Результат: артефакт PirateArena-ipa внизу страницы запуска.

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths-ignore:
      - "docs/**"
      - "*.md"

env:
  GODOT_VERSION: "4.7.2"
  PROJECT_NAME: "PirateArena"

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Кэш Godot и шаблонов экспорта
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/Library/Application Support/Godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-${{ runner.os }}

      - name: Установка Godot + export templates
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          BASE="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          mkdir -p "$HOME/godot"
          curl -fsSL -o /tmp/godot.zip "$BASE/Godot_v${GODOT_VERSION}-stable_macos.universal.zip"
          unzip -q /tmp/godot.zip -d "$HOME/godot"

          curl -fsSL -o /tmp/templates.tpz "$BASE/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q /tmp/templates.tpz -d /tmp/templates
          mkdir -p "$HOME/Library/Application Support/Godot/export_templates"
          rm -rf "$HOME/Library/Application Support/Godot/export_templates/${GODOT_VERSION}.stable"
          mv /tmp/templates/templates "$HOME/Library/Application Support/Godot/export_templates/${GODOT_VERSION}.stable"

      - name: Версия Xcode
        run: xcodebuild -version

      - name: Импорт ресурсов (создать .godot)
        run: |
          "$HOME/godot/Godot.app/Contents/MacOS/Godot" --headless --path . --import

      - name: Экспорт Xcode-проекта
        run: |
          set -uo pipefail
          mkdir -p build/ios
          # export_project_only=true в пресете, но если движок всё же попробует
          # собрать .ipa без сертификатов — это не ошибка, проект уже создан.
          "$HOME/godot/Godot.app/Contents/MacOS/Godot" --headless --verbose \
            --path . --export-release "iOS" "build/ios/${PROJECT_NAME}" || true
          test -d "build/ios/${PROJECT_NAME}.xcodeproj" || { echo "Xcode-проект не создан"; exit 1; }

      - name: Сборка .app без подписи
        run: |
          set -euo pipefail
          cd build/ios
          xcodebuild \
            -project "${PROJECT_NAME}.xcodeproj" \
            -scheme "${PROJECT_NAME}" \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            DEVELOPMENT_TEAM="" \
            build

      - name: Упаковка в .ipa (без подписи)
        run: |
          set -euo pipefail
          APP=$(find "$RUNNER_TEMP/dd/Build/Products/Release-iphoneos" -maxdepth 1 -name "*.app" | head -n1)
          echo "APP=$APP"
          rm -rf "$RUNNER_TEMP/ipa"
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$APP" "$RUNNER_TEMP/ipa/Payload/"
          cd "$RUNNER_TEMP/ipa"
          zip -qry "${PROJECT_NAME}-unsigned.ipa" Payload
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp "${PROJECT_NAME}-unsigned.ipa" "$GITHUB_WORKSPACE/out/"

      - name: Артефакт
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PROJECT_NAME }}-ipa
          path: out/${{ env.PROJECT_NAME }}-unsigned.ipa
          if-no-files-found: error
